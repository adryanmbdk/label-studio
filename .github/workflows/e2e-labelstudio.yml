name: E2E — labelstudio-e2e (Cypress)

on:
  pull_request:
    branches: [develop]

jobs:
  cypress-e2e:
    name: Cypress — fluxo de autenticação
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DJANGO_DB: sqlite
      DJANGO_SETTINGS_MODULE: core.settings.label_studio
      COLLECT_ANALYTICS: false
      SENTRY_RATE: 0
      JSON_LOG: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'poetry'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: web/yarn.lock

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 libldap2-dev libsasl2-dev libssl-dev \
            libxml2-dev libxslt-dev python3-dev

      - name: Install Python dependencies
        run: poetry install

      - name: Generate version file
        run: poetry run python label_studio/core/version.py

      - name: Run migrations
        run: poetry run python label_studio/manage.py migrate --noinput

      - name: Start Label Studio
        run: |
          poetry run python label_studio/manage.py runserver 8080 --noreload &
          npx wait-on http://localhost:8080/user/login/ --timeout 180000

      - name: Install frontend dependencies
        working-directory: web
        run: yarn install --frozen-lockfile

      - name: Run Cypress e2e
        working-directory: web
        run: npx nx run labelstudio-e2e:e2e

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: web/dist/cypress
          if-no-files-found: ignore
